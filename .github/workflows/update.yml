name: Auto Dividend Scraper

on:
  schedule:
    # 한국 시간 밤 12시 (UTC 기준 오후 3시) 매일 실행 (월~금)
    - cron: '0 15 * * 1-5' 
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 저장소 코드 불러오기
        uses: actions/checkout@v3

      - name: ⚙️ 파이썬 환경 세팅
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 V17.1 크롤링 필수 라이브러리 설치
        run: pip install requests pandas lxml html5lib beautifulsoup4 urllib3

      - name: 🚀 배당금 마스터 봇 출동!
        run: python scraper.py
