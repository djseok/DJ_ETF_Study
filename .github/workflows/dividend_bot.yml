name: Auto Dividend Scraper

on:
  schedule:
    # 한국 시간 기준 매일 밤 11시 30분에 작동 (UTC 기준 14시 30분)
    - cron: '30 14 * * 1-5' 
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v3

      - name: 파이썬 환경 세팅
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 크롤링 라이브러리 설치
        run: pip install requests pandas

      - name: 🚀 배당금 크롤링 봇 출동!
        run: python xray_scanner.py
