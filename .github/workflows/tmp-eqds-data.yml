name: tmp-eqds-data
on:
  push:
    branches: [tmp/eqds-data]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tmpdata
          for t in SMCI NKE SPY QQQ; do
            f=$(echo "$t" | tr '^' '_')
            for h in query1 query2 query1; do
              curl -sS -A "Mozilla/5.0" "https://$h.finance.yahoo.com/v8/finance/chart/$t?range=10y&interval=1d" -o "tmpdata/$f.json" && grep -q '"timestamp"' "tmpdata/$f.json" && break
              sleep 3
            done
            ls -la "tmpdata/$f.json"; sleep 1
          done
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add tmpdata && git commit -m "tmp: price data" && git push
