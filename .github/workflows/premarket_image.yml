name: Premarket Alert Image

# 관리시트 Apps Script(premarket_alert.gs)가 평일 07:30 에 repository_dispatch 로 계산 결과를 보내면
# A(막대)·B(표) 이미지를 그려 alerts/ 에 올립니다 (금요일 주간 리포트 weekly-image 도 같이 처리) → GitHub Pages 주소로 카카오톡 사진 메시지 발송
on:
  repository_dispatch:
    types: [premarket-image, weekly-image]
  workflow_dispatch: # 수동 실행 = 예시 데이터로 그리기 테스트

permissions:
  contents: write

concurrency:
  group: premarket-image
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 저장소 불러오기
        uses: actions/checkout@v4

      # 글꼴은 캐시에서 꺼내 씀 (2026-10-23 apt 설치가 14분 걸려 07:30 알림이 글자 메시지로 쪼개져 감)
      - name: 🔤 한글 글꼴 캐시
        id: font-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/noto-cjk
          key: noto-cjk-v1

      - name: 🔤 한글 글꼴 설치 (캐시 없을 때만)
        if: steps.font-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: |
          sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk > /dev/null 2>&1 \
            || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk > /dev/null)
          mkdir -p ~/.cache/noto-cjk
          cp /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc /usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc ~/.cache/noto-cjk/ \
            || rm -rf ~/.cache/noto-cjk  # 복사 실패 시 빈 캐시가 저장되지 않게

      - name: ⚙️ 파이썬
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 라이브러리
        run: pip install -q matplotlib pillow

      - name: 🖼 이미지 그리기
        env:
          PREMARKET_DATA: ${{ github.event.client_payload.data }}
          WEEKLY_DATA: ${{ github.event.client_payload.data }}
          EVENT: ${{ github.event.action }}
        run: |
          cd tools
          if [ "$EVENT" = "weekly-image" ]; then python render_weekly.py
          elif [ -n "$PREMARKET_DATA" ]; then python render_premarket.py
          else python render_premarket.py --sample && python render_weekly.py --sample; fi

      - name: 📤 올리기
        run: |
          git config user.name "premarket-bot"
          git config user.email "premarket-bot@users.noreply.github.com"
          git add -A alerts
          git commit -m "개장 전 예상 이미지 $(TZ=Asia/Seoul date +%F_%H%M)" || exit 0
          git pull --rebase -q && git push -q
